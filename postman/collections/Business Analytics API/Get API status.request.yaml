$kind: http-request
method: GET
url: '{{baseUrl}}/'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response contains project and online status", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("project");
        pm.expect(json).to.have.property("status", "online");
      });
